<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f8f9fa;
        }
        h1 { color: #333; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 20px;
            cursor: pointer;
        }
        #message {
            font-size: 22px;
            margin-top: 30px;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <h1>JavaScript Fundamentals</h1>
    <p>Click the button and check the browser console (F12)</p>
    <button id="clickBtn">Click Me!</button>
    <p id="message"></p>

    <script src="script.js"></script>
</body>
</html>
